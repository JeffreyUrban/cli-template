name: Test Template

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-template:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]

    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install cookiecutter
        run: pip install cookiecutter

      - name: Generate project from template
        run: |
          cookiecutter . --no-input \
            project_name="Test CLI Tool" \
            author_name="Test Author" \
            github_username="testuser"

      - name: Verify generated structure
        run: |
          echo "=== Checking workspace structure ==="
          ls -la test-cli-tool-workspace/
          echo ""
          echo "=== Checking generated directory structure ==="
          ls -la test-cli-tool-workspace/test-cli-tool/
          echo ""
          echo "=== Checking Homebrew tap structure ==="
          ls -la test-cli-tool-workspace/homebrew-test-cli-tool/
          ls -la test-cli-tool-workspace/homebrew-test-cli-tool/Formula/
          echo ""
          echo "=== Checking Python package structure ==="
          ls -la test-cli-tool-workspace/test-cli-tool/src/
          ls -la test-cli-tool-workspace/test-cli-tool/src/test_cli_tool/
          echo ""
          echo "=== Checking pyproject.toml ==="
          cat test-cli-tool-workspace/test-cli-tool/pyproject.toml | grep -A2 "\[project\]"
          cat test-cli-tool-workspace/test-cli-tool/pyproject.toml | grep -A1 "\[project.scripts\]"

      - name: Replace kickoff placeholders
        run: |
          cd test-cli-tool-workspace/test-cli-tool
          # Replace Python version placeholders with actual versions for testing
          sed -i 's/PYTHON_VERSION_MIN_KICKOFF/3.9/g' pyproject.toml .github/workflows/test.yml README.md
          sed -i 's/PYTHON_VERSION_MAX_KICKOFF/3.14/g' pyproject.toml .github/workflows/test.yml
          # Replace intermediate version placeholders
          sed -i 's/PYTHON_VERSION_INTERMEDIATE_1_KICKOFF/3.10/g' pyproject.toml
          sed -i 's/PYTHON_VERSION_INTERMEDIATE_2_KICKOFF/3.11/g' pyproject.toml
          sed -i 's/PYTHON_VERSION_INTERMEDIATE_3_KICKOFF/3.12/g' pyproject.toml
          sed -i 's/PYTHON_VERSION_INTERMEDIATE_4_KICKOFF/3.13/g' pyproject.toml

      - name: Initialize git (required for hatch-vcs)
        run: |
          cd test-cli-tool-workspace/test-cli-tool
          git init
          git config user.email "test@example.com"
          git config user.name "Test Author"
          git add .
          git commit -m "Initial commit"
          git tag v0.1.0

      - name: Install dependencies
        run: |
          cd test-cli-tool-workspace/test-cli-tool
          uv venv
          source .venv/bin/activate
          uv pip install -e '.[dev,docs]'

      - name: Run pytest
        run: |
          cd test-cli-tool-workspace/test-cli-tool
          source .venv/bin/activate
          # Skip tests that require template placeholders to be replaced
          pytest -v --tb=short \
            --ignore=tests/test_mkdocs_build.py \
            -k 'not test_cli_help and not (test_code_block_line_length and test-cli-tool.md)'

      - name: Test CLI execution
        run: |
          cd test-cli-tool-workspace/test-cli-tool
          source .venv/bin/activate
          echo "=== Testing --version ==="
          test-cli-tool --version
          echo ""
          echo "=== Testing --help ==="
          test-cli-tool --help
          echo ""
          echo "=== Testing basic execution ==="
          echo "test line 1" > test.txt
          echo "test line 2" >> test.txt
          test-cli-tool test.txt

      - name: Verify naming convention
        run: |
          cd test-cli-tool-workspace/test-cli-tool
          source .venv/bin/activate
          echo "=== Verifying naming convention ==="
          echo "✓ CLI command name should use hyphens: test-cli-tool"
          which test-cli-tool
          echo ""
          echo "✓ Python package name should use underscores: test_cli_tool"
          ls src/ | grep test_cli_tool
          echo ""
          echo "✓ Project directory should use hyphens"
          pwd | grep test-cli-tool
          echo ""
          echo "=== All naming conventions verified! ==="

      - name: Test code quality tools
        run: |
          cd test-cli-tool-workspace/test-cli-tool
          source .venv/bin/activate
          echo "=== Running ruff linter ==="
          ruff check src/ tests/
          echo ""
          echo "=== Running ruff formatter check ==="
          ruff format --check src/ tests/ --exclude '*/_version.py'
          echo ""
          echo "=== Running mypy ==="
          mypy src/test_cli_tool

      # Skip documentation build test - template has placeholders that need to be replaced
      # Users should run 'mkdocs build' after completing the project kickoff
      # - name: Test documentation build
      #   run: |
      #     cd test-cli-tool-workspace/test-cli-tool
      #     source .venv/bin/activate
      #     echo "=== Building documentation ==="
      #     mkdocs build --strict
      #     echo ""
      #     echo "=== Documentation built successfully ==="
