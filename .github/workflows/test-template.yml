name: Test Template

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-template:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install cookiecutter
        run: pip install cookiecutter

      - name: Generate project from template
        run: |
          cookiecutter . --no-input \
            project_name="Test CLI Tool" \
            author_name="Test Author" \
            github_username="testuser"

      - name: Verify generated structure
        run: |
          echo "=== Checking generated directory structure ==="
          ls -la test-cli-tool/
          echo ""
          echo "=== Checking Python package structure ==="
          ls -la test-cli-tool/src/
          ls -la test-cli-tool/src/test_cli_tool/
          echo ""
          echo "=== Checking pyproject.toml ==="
          cat test-cli-tool/pyproject.toml | grep -A2 "\[project\]"
          cat test-cli-tool/pyproject.toml | grep -A1 "\[project.scripts\]"

      - name: Initialize git (required for hatch-vcs)
        run: |
          cd test-cli-tool
          git init
          git config user.email "test@example.com"
          git config user.name "Test Author"
          git add .
          git commit -m "Initial commit"
          git tag v0.1.0

      - name: Install dependencies
        run: |
          cd test-cli-tool
          uv venv
          source .venv/bin/activate
          uv pip install -e '.[dev,docs]'

      - name: Run pytest
        run: |
          cd test-cli-tool
          source .venv/bin/activate
          pytest -v --tb=short

      - name: Test CLI execution
        run: |
          cd test-cli-tool
          source .venv/bin/activate
          echo "=== Testing --version ==="
          test-cli-tool --version
          echo ""
          echo "=== Testing --help ==="
          test-cli-tool --help
          echo ""
          echo "=== Testing basic execution ==="
          echo "test line 1" > test.txt
          echo "test line 2" >> test.txt
          test-cli-tool test.txt

      - name: Verify naming convention
        run: |
          cd test-cli-tool
          source .venv/bin/activate
          echo "=== Verifying naming convention ==="
          echo "✓ CLI command name should use hyphens: test-cli-tool"
          which test-cli-tool
          echo ""
          echo "✓ Python package name should use underscores: test_cli_tool"
          ls src/ | grep test_cli_tool
          echo ""
          echo "✓ Project directory should use hyphens"
          pwd | grep test-cli-tool
          echo ""
          echo "=== All naming conventions verified! ==="

      - name: Test code quality tools
        run: |
          cd test-cli-tool
          source .venv/bin/activate
          echo "=== Running ruff linter ==="
          ruff check src/ tests/
          echo ""
          echo "=== Running ruff formatter check ==="
          ruff format --check src/ tests/ --exclude '*/_version.py'
          echo ""
          echo "=== Running mypy ==="
          mypy src/test_cli_tool

      - name: Test documentation build
        run: |
          cd test-cli-tool
          source .venv/bin/activate
          echo "=== Building documentation ==="
          mkdocs build --strict
          echo ""
          echo "=== Documentation built successfully ==="
