name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for PyPI release
        id: wait
        run: |
          VERSION="{% raw %}${{ github.event.client_payload.version }}{% endraw %}"
          echo "Waiting for PyPI release of version ${VERSION}..."

          # Wait up to 10 minutes for the release to appear on PyPI
          MAX_ATTEMPTS=60
          SLEEP_TIME=10

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt ${i}/${MAX_ATTEMPTS}: Checking PyPI..."

            # Check if version exists
            RELEASES=$(curl -s https://pypi.org/pypi/{{ cookiecutter.package_name }}/json | jq -r '.releases | keys[]')

            if echo "$RELEASES" | grep -q "^${VERSION}$"; then
              echo "✅ Version ${VERSION} found on PyPI!"
              echo "release_found=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "❌ Timeout: Version ${VERSION} not found on PyPI after ${MAX_ATTEMPTS} attempts"
              echo "release_found=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "Version not yet available, waiting ${SLEEP_TIME}s..."
            sleep "$SLEEP_TIME"
          done

      - name: Get package info from PyPI
        id: pypi
        if: steps.wait.outputs.release_found == 'true'
        run: |
          VERSION="{% raw %}${{ github.event.client_payload.version }}{% endraw %}"
          echo "Fetching package info for version ${VERSION}"

          # Wait a bit longer for package metadata to be fully available
          echo "Waiting additional 30 seconds for package metadata to propagate..."
          sleep 30

          # Retry fetching package info with exponential backoff
          MAX_ATTEMPTS=5
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: Fetching package info..."

            # Get source distribution info
            INFO=$(curl -s https://pypi.org/pypi/{{ cookiecutter.package_name }}/json | jq -r ".releases[\"${VERSION}\"][] | select(.packagetype==\"sdist\")")
            URL=$(echo "$INFO" | jq -r '.url')
            SHA256=$(echo "$INFO" | jq -r '.digests.sha256')

            if [ -n "$URL" ] && [ -n "$SHA256" ] && [ "$URL" != "null" ] && [ "$SHA256" != "null" ]; then
              echo "url=${URL}" >> "$GITHUB_OUTPUT"
              echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
              echo "✅ Package URL: ${URL}"
              echo "✅ SHA256: ${SHA256}"
              exit 0
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Error: Could not fetch package info from PyPI after ${MAX_ATTEMPTS} attempts"
              echo "URL: ${URL}"
              echo "SHA256: ${SHA256}"
              exit 1
            fi

            WAIT_TIME=$((ATTEMPT * 10))
            echo "Package info not ready, waiting ${WAIT_TIME}s before retry..."
            sleep $WAIT_TIME
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Update formula
        run: |
          VERSION="{% raw %}${{ github.event.client_payload.version }}{% endraw %}"
          URL="{% raw %}${{ steps.pypi.outputs.url }}{% endraw %}"
          SHA256="{% raw %}${{ steps.pypi.outputs.sha256 }}{% endraw %}"

          # Update main package URL and SHA256
          # Note: PyPI normalizes package names by converting hyphens to underscores in filenames
          # Match both forms: {{ cookiecutter.package_name }} and {{ cookiecutter.package_name | replace('-', '_') }}
          sed -i "s|url \"https://files.pythonhosted.org/packages/.*/{{ cookiecutter.package_name | replace('-', '[_-]') }}-.*\.tar\.gz\"|url \"${URL}\"|" Formula/{{ cookiecutter.command_name }}.rb

          # Find the sha256 line that follows the package url and update it
          # Note: Match both hyphen and underscore variants due to PyPI normalization
          awk -v url="${URL}" -v sha="${SHA256}" '
            /url "https:.*{{ cookiecutter.package_name | replace('-', '[_-]') }}-/ { print; getline; sub(/sha256 ".*"/, "sha256 \"" sha "\""); print; next }
            {print}
          ' Formula/{{ cookiecutter.command_name }}.rb > Formula/{{ cookiecutter.command_name }}.rb.tmp
          mv Formula/{{ cookiecutter.command_name }}.rb.tmp Formula/{{ cookiecutter.command_name }}.rb

          # Update version in test
          sed -i "s/assert_match \"{{ cookiecutter.command_name }} version .*/assert_match \"{{ cookiecutter.command_name }} version $VERSION\", output/" Formula/{{ cookiecutter.command_name }}.rb

          echo "✅ Formula updated"

      - name: Verify changes
        run: |
          echo "=== Changes to Formula/{{ cookiecutter.command_name }}.rb ==="
          git diff Formula/{{ cookiecutter.command_name }}.rb

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: Update {{ cookiecutter.command_name }} to v{% raw %}${{ github.event.client_payload.version }}{% endraw %}"
          title: "Update {{ cookiecutter.command_name }} to v{% raw %}${{ github.event.client_payload.version }}{% endraw %}"
          body: |
            Automatically generated PR to update {{ cookiecutter.command_name }} formula.

            **Version:** {% raw %}${{ github.event.client_payload.version }}{% endraw %}
            **PyPI Release:** https://pypi.org/project/{{ cookiecutter.package_name }}/{% raw %}${{ github.event.client_payload.version }}{% endraw %}/

            ### Changes
            - Updated source URL and SHA256 hash
            - Updated version test assertion

            ### Testing Checklist
            - [ ] Verify SHA256 hash matches PyPI
            - [ ] Test local installation: `brew install --build-from-source {{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}/{{ cookiecutter.command_name }}`
            - [ ] Run tests: `brew test {{ cookiecutter.command_name }}`
            - [ ] Verify version: `{{ cookiecutter.command_name }} --version`

            ---
            *This PR was automatically created by the update-formula workflow triggered from the main {{ cookiecutter.project_slug }} repository.*
          branch: update-v{% raw %}${{ github.event.client_payload.version }}{% endraw %}
          delete-branch: true
          labels: |
            automated
            version-update

      - name: Verify PR was created
        run: |
          if [ -z "{% raw %}${{ steps.create-pr.outputs.pull-request-number }}{% endraw %}" ]; then
            echo "❌ Error: No pull request was created!"
            echo "This likely means no changes were detected in the formula."
            echo "Check the 'Update formula' step output to verify the sed/awk commands matched correctly."
            exit 1
          fi
          echo "✅ Pull request #{% raw %}${{ steps.create-pr.outputs.pull-request-number }}{% endraw %} created successfully"
          echo "PR URL: {% raw %}${{ steps.create-pr.outputs.pull-request-url }}{% endraw %}"
